# Jayhind ERP — production nginx site. Installed as
# /etc/nginx/sites-available/jayhind.conf by server-bootstrap.sh.
#
#   aakhaja.com         → client-front  (static, 127.0.0.1:4300)
#   api.aakhaja.com     → client-back   (pm2,    127.0.0.1:3000)
#   hub.aakhaja.com     → admin-front   (static, 127.0.0.1:4500)
#   apihub.aakhaja.com  → admin-back    (pm2,    127.0.0.1:3100)
#
# Every public name is proxied by Cloudflare (orange cloud), so public TLS ends
# at Cloudflare. The origin answers on 443 with the certificate in
# /etc/nginx/ssl/ (SSL mode "Full"; install a Cloudflare Origin Certificate
# there to use "Full (strict)") and on 80 too, so "Flexible" also works. The
# origin never redirects 80 → 443 itself: under "Flexible" that is a loop.
# Turn on "Always Use HTTPS" in Cloudflare instead.
#
# The real client IP arrives in CF-Connecting-IP, trusted only from Cloudflare's
# ranges (conf.d/cloudflare-realip.conf). It is then sent upstream as a single
# X-Forwarded-For value — overwritten, never appended, so a client cannot inject
# its own — and both backends run with TRUST_PROXY=loopback.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

map $http_x_forwarded_proto $jayhind_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# ── Static frontends on their internal ports ────────────────────────────────
server {
    listen 127.0.0.1:4300;
    root /srv/jayhind/client-front/current;
    include /etc/nginx/snippets/jayhind-spa.conf;
}

server {
    listen 127.0.0.1:4500;
    root /srv/jayhind/admin-front/current;
    include /etc/nginx/snippets/jayhind-spa.conf;
}

# ── Unknown hosts (raw IP, stale DNS) get nothing ───────────────────────────
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_certificate     /etc/nginx/ssl/aakhaja.com.crt;
    ssl_certificate_key /etc/nginx/ssl/aakhaja.com.key;
    server_name _;
    return 444;
}

# ── Public names ────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name aakhaja.com www.aakhaja.com;
    include /etc/nginx/snippets/jayhind-tls.conf;

    location / {
        proxy_pass http://127.0.0.1:4300;
        include /etc/nginx/snippets/jayhind-proxy.conf;
    }
}

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name hub.aakhaja.com;
    include /etc/nginx/snippets/jayhind-tls.conf;

    location / {
        proxy_pass http://127.0.0.1:4500;
        include /etc/nginx/snippets/jayhind-proxy.conf;
    }
}

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.aakhaja.com;
    include /etc/nginx/snippets/jayhind-tls.conf;

    # Tally/data imports and attachments are spooled by multer; 100 MB is also
    # Cloudflare's request-body ceiling on the Free/Pro plans.
    client_max_body_size 100m;
    # Invoice scanning waits on the hub, whose OCR budget is 660 s (§6.2).
    proxy_read_timeout 700s;
    proxy_send_timeout 700s;

    location / {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/snippets/jayhind-proxy.conf;
    }
}

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name apihub.aakhaja.com;
    include /etc/nginx/snippets/jayhind-tls.conf;

    client_max_body_size 50m;
    proxy_read_timeout 700s;
    proxy_send_timeout 700s;

    location / {
        proxy_pass http://127.0.0.1:3100;
        include /etc/nginx/snippets/jayhind-proxy.conf;
    }
}
