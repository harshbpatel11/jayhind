# An Angular build served as a single-page app.
index index.html;
disable_symlinks off;   # `current` is a symlink to the live release

# Content-hashed bundles (main-7PWNKTL5.js, chunk-…, styles-…) never change.
location ~* "-[A-Z0-9]{8}\.(js|css)$" {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}

# The shell and the service worker must be re-checked on every visit, or a
# deploy is invisible until the browser's cache happens to expire.
location ~* ^/(index\.html|ngsw\.json|ngsw-worker\.js|safety-worker\.js|worker-basic\.min\.js|manifest\.webmanifest)$ {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
}

# A deep link (/transaction/voucher/sales/new) falls back to /index.html. That
# is an internal redirect, so it is answered by the no-cache block above, not
# with this block's one-hour header.
location / {
    add_header Cache-Control "public, max-age=3600";
    try_files $uri $uri/ /index.html;
}
